[package]
name = "androidapp"
version = "0.2.0"
edition = "2021"
description = "Health Hub: Fitbit Air (via Health Connect) + Xiaomi S400 scale metrics, reports and recommendations"

[lib]
name = "androidapp"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "androidapp-desktop"
path = "src/main.rs"

[dependencies]
egui = "0.29"
egui_plot = "0.29"
eframe = { version = "0.29", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "android-native-activity",
] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
aes = "0.8"
ccm = "0.5"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
jni = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

[profile.release]
strip = "debuginfo"
